name: Library checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  circuit-library:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neknaj/circuitgame2-cli
          ref: 537c9367f0c0a18b51680ba9a90cc74729d4e0f0
          path: cli
          persist-credentials: false
      - name: Build ncg2
        working-directory: cli
        run: cargo build --locked --bin ncg2
      - name: Check public gates and truth tables
        run: python3 tests/check_gates.py cli/target/debug/ncg2
      - name: Check and evaluate NCG2M Boolean helpers from a separate namespace
        shell: bash
        run: |
          sources=(src/ncg2m/bool/logic.ncg2m tests/ncg2m/import.ncg2m)
          cli/target/debug/ncg2 check "${sources[@]}"
          for left in false true; do
            for right in false true; do
              expected=false
              if [[ "$left" == "$right" ]]; then expected=true; fi
              actual=$(cli/target/debug/ncg2 eval-meta --defn ::library-check::same \
                --arg "$left" --arg "$right" --fuel 100 "${sources[@]}")
              if [[ "$actual" != "$expected" ]]; then
                printf 'same(%s, %s): expected %s, got %s\n' "$left" "$right" "$expected" "$actual" >&2
                exit 1
              fi
            done
          done
